name: Build

on:
  push:
    branches: [main, master]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP 'var version = "\K[^"]+' main.go)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          PKG_DIR="inner-auth-${{ matrix.goos }}-${{ matrix.goarch }}"
          BINARY_NAME="inner-auth"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          mkdir -p "$PKG_DIR"
          go build -ldflags "-s -w -X 'main.version=${{ steps.version.outputs.version }}'" -o "$PKG_DIR/$BINARY_NAME" .

      - name: Prepare release package
        run: |
          OS="${{ matrix.goos }}"
          ARCH="${{ matrix.goarch }}"
          PKG_DIR="inner-auth-${OS}-${ARCH}"

          cp config.json.template "$PKG_DIR/" 2>/dev/null || true
          cp -r templates "$PKG_DIR/" 2>/dev/null || true
          cp README.md "$PKG_DIR/" 2>/dev/null || true
          cp LICENSE "$PKG_DIR/" 2>/dev/null || true

          zip -r "${PKG_DIR}.zip" "$PKG_DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: inner-auth-${{ matrix.goos }}-${{ matrix.goarch }}
          path: inner-auth-${{ matrix.goos }}-${{ matrix.goarch }}.zip
          retention-days: 30

  release-assets:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            inner-auth-linux-amd64.zip
            inner-auth-linux-arm64.zip
            inner-auth-darwin-amd64.zip
            inner-auth-darwin-arm64.zip
            inner-auth-windows-amd64.zip