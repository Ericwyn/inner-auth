<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --text: #ffffff;
            --text-muted: #888888;
            --input-bg: #2a2a2a;
            --input-border: #3a3a3a;
            --input-focus: #ffffff;
            --btn-bg: #ffffff;
            --btn-text: #0a0a0a;
            --error: #ff4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }

        .login-title {
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--input-focus);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:active {
            opacity: 0.8;
        }

        .error-message {
            margin-top: 20px;
            padding: 12px;
            background-color: rgba(255, 68, 68, 0.1);
            border: 1px solid var(--error);
            border-radius: 6px;
            color: var(--error);
            font-size: 14px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1 class="login-title">{{ .Title }}</h1>
        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">{{ .I18n.LabelUsername }}</label>
                <input type="text"
                       name="username"
                       id="username"
                       autocomplete="username"
                       placeholder="{{ .I18n.PlaceholderUsername }}"
                       required />
            </div>
            <div class="form-group">
                <label for="password">{{ .I18n.LabelPassword }}</label>
                <input type="password"
                       name="password"
                       id="password"
                       autocomplete="current-password"
                       placeholder="{{ .I18n.PlaceholderPassword }}"
                       required />
            </div>
            {{ if .TOTPRequired }}
            <div class="form-group">
                <label for="totp">{{ .I18n.LabelTOTP }}</label>
                <input type="text"
                       name="totp"
                       id="totp"
                       autocomplete="one-time-code"
                       inputmode="numeric"
                       pattern="[0-9]*"
                       maxlength="6"
                       placeholder="{{ .I18n.PlaceholderTOTP }}" />
            </div>
            {{ end }}
            <button type="submit" class="submit-btn">{{ .I18n.BtnLogin }}</button>
        </form>
        {{ if .Error }}
        <div class="error-message">{{ .Error }}</div>
        {{ end }}
    </div>
</body>
</html>
